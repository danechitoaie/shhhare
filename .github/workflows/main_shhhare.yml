# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - shhhare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: shhhare.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CAFCDAFA424C4B2B8C5EFE27CF6F2762 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_0F7714EF3560419DA5FD2F2EBB9EB75A }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: shhhare.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CAFCDAFA424C4B2B8C5EFE27CF6F2762 }}/shhhare:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'shhhare'
          slot-name: 'Production'
          images: 'shhhare.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CAFCDAFA424C4B2B8C5EFE27CF6F2762 }}/shhhare:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_70F9E2F4696748AC9C1EAF03F5CE459D }}