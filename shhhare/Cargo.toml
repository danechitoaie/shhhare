[package]
name = "shhhare"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.83"
bs58 = "0.5.1"
bytesize = "2.3.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
getrandom = "0.4.2"
hex = "0.4.3"
poem = { version = "3.1.12", features = ["server", "embed"] }
poem-openapi = "5.1.16"
redis = { version = "1.2.0", features = ["aio", "connection-manager", "tokio-native-tls-comp"] }
reqwest = { version = "0.13.4", features = ["json", "deflate", "gzip", "brotli"] }
rust-embed = { version = "8.11.0", features = ["debug-embed", "compression", "include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
